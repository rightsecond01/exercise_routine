<!DOCTYPE html>
<html>
<head>
    <title>나의 운동 루틴</title>
    <link rel="stylesheet" href="style.css?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script>
        const CURRENT_VERSION = '2.0'; // 현재 프로젝트 버전

        window.onload = function() {
            checkVersion();
        };

        function checkVersion() {
            const storedVersion = localStorage.getItem('app_version');
            if (storedVersion !== CURRENT_VERSION) {
                console.log('버전이 업데이트되었습니다. 강제 새로고침합니다.');
                localStorage.setItem('app_version', CURRENT_VERSION);
                window.location.reload(true); // 강제 새로고침
            }
        }
    </script>
</head>
<body>
    <h1>나의 운동 루틴</h1>

    <div id="routineListContainer">
    </div>

    <button onclick="showAddRoutineInput()">새로운 루틴 추가</button>
    <div id="newRoutineInput" style="display: none;">
        <h2>새로운 루틴 추가</h2>
        <label for="newRoutineName">루틴 이름</label>
        <input type="text" id="newRoutineName" placeholder="루틴 이름">
        <div id="exercisesContainer">
            <div class="exercise-input-group">
                <label for="exerciseName-1">운동 이름</label>
                <input type="text" class="exercise-name" id="exerciseName-1" placeholder="운동 이름">
                <label for="exerciseWeight-1">초기 무게</label>
                <div style="display: flex; align-items: center;">
                    <input type="number" class="exercise-weight" id="exerciseWeight-1" placeholder="초기 무게">
                    <label style="margin-left: 10px;"><input type="checkbox" class="use-lbs"> 파운드 (LBS)</label>
                </div>
                <label for="exerciseReps-1">기본 횟수</label>
                <input type="number" class="exercise-reps" id="exerciseReps-1" placeholder="기본 횟수">
            </div>
        </div>
        <button type="button" id="addExerciseButton" onclick="addExerciseInput()">운동 추가</button>
        <div>
            <button type="button" onclick="saveNewRoutine()">저장</button>
            <button type="button" onclick="hideAddRoutineInput()">취소</button>
        </div>
    </div>

    <div id="todayWorkoutEditArea">
        <h2>오늘의 운동 편집</h2>
        <div id="todayExercisesContainer">
            </div>
        <button type="button" onclick="addTodayExerciseInput()">운동 추가</button>
        <div>
            <button type="button" onclick="startTodayWorkout()">운동 시작</button>
            <button type="button" onclick="cancelTodayWorkoutEdit()">취소</button>
        </div>
    </div>

    <div id="todayWorkoutLog">
        <h2>오늘의 운동 기록</h2>
        <div id="todayWorkoutDetails">
        </div>
    </div>
    <button onclick="shareWorkoutLog()">오늘의 운동 기록 공유</button>

    <script>
        const datetimeDiv = document.getElementById('datetime');
        const routineListContainer = document.getElementById('routineListContainer');
        const newRoutineInputDiv = document.getElementById('newRoutineInput');
        const newRoutineNameInput = document.getElementById('newRoutineName');
        const exercisesContainer = document.getElementById('exercisesContainer');
        const addExerciseButton = document.getElementById('addExerciseButton');

        const ROUTINES_KEY = 'user_routines';
        let currentlyEditingId = null;
        let editingRoutine = null;

        function showAddRoutineInput() {
            newRoutineInputDiv.style.display = 'block';
        }

        function hideAddRoutineInput() {
            newRoutineInputDiv.style.display = 'none';
            exercisesContainer.innerHTML = `
                <div class="exercise-input-group">
                    <label for="exerciseName-1">운동 이름</label>
                    <input type="text" class="exercise-name" id="exerciseName-1" placeholder="운동 이름">
                    <label for="exerciseWeight-1">초기 무게 (kg)</label>
                    <input type="number" class="exercise-weight" id="exerciseWeight-1" placeholder="초기 무게 (kg)">
                    <label for="exerciseReps-1">기본 횟수</label>
                    <input type="number" class="exercise-reps" id="exerciseReps-1" placeholder="기본 횟수">
                </div>
            `;
            newRoutineNameInput.value = '';
        }

        function addExerciseInput() {
            const newExerciseInput = document.createElement('div');
            newExerciseInput.classList.add('exercise-input-group');
            const index = exercisesContainer.children.length + 1;
            newExerciseInput.innerHTML = `
                <label for="exerciseName-${index}">운동 이름</label>
                <input type="text" class="exercise-name" id="exerciseName-${index}" placeholder="운동 이름">
                <label for="exerciseWeight-${index}">초기 무게</label>
                <div style="display: flex; align-items: center;">
                    <input type="number" class="exercise-weight" id="exerciseWeight-${index}" placeholder="초기 무게">
                    <label style="margin-left: 10px;"><input type="checkbox" class="use-lbs"> 파운드 (LBS)</label>
                </div>
                <label for="exerciseReps-${index}">기본 횟수</label>
                <input type="number" class="exercise-reps" id="exerciseReps-${index}" placeholder="기본 횟수">
                <button type="button" class="remove-exercise-button" onclick="removeExerciseInput(this)">행삭제</button>
            `;

            // 구분선 추가
            if (exercisesContainer.children.length > 0) {
                const separator = document.createElement('div');
                separator.classList.add('exercise-separator');
                exercisesContainer.appendChild(separator);
            }
            exercisesContainer.appendChild(newExerciseInput);
        }

        function saveNewRoutine() {
            const newRoutineName = newRoutineNameInput.value.trim();
            if (newRoutineName) {
                const exercises = [];
                const exerciseInputs = exercisesContainer.querySelectorAll('.exercise-input-group');
                exerciseInputs.forEach(inputGroup => {
                    const nameInput = inputGroup.querySelector('.exercise-name');
                    const weightInput = inputGroup.querySelector('.exercise-weight');
                    const repsInput = inputGroup.querySelector('.exercise-reps');
                    const useLbsCheckbox = inputGroup.querySelector('.use-lbs');

                    if (nameInput.value.trim()) {
                        let weight = parseFloat(weightInput.value) || '';
                        const unit = useLbsCheckbox.checked ? 'lbs' : 'kg';
                        exercises.push({
                            name: nameInput.value.trim(),
                            initialWeight: weight,
                            initialReps: repsInput.value || '',
                            unit: unit
                        });
                    }
                });

                if (exercises.length > 0) {
                    const existingRoutinesString = localStorage.getItem(ROUTINES_KEY);
                    const existingRoutines = existingRoutinesString ? JSON.parse(existingRoutinesString) : [];

                    const newRoutineId = newRoutineName.toLowerCase().replace(/ /g, '-');
                    const newRoutine = { id: newRoutineId, name: newRoutineName, exercises: exercises };
                    existingRoutines.push(newRoutine);

                    localStorage.setItem(ROUTINES_KEY, JSON.stringify(existingRoutines));
                    hideAddRoutineInput();
                    loadRoutines();
                } else {
                    alert('최소한 하나의 운동을 추가해주세요.');
                }
            } else {
                alert('루틴 이름을 입력해주세요.');
            }
        }

        function editRoutine(routineId) {
            currentlyEditingId = routineId;
            const storedRoutinesString = localStorage.getItem(ROUTINES_KEY);
            const storedRoutines = storedRoutinesString ? JSON.parse(storedRoutinesString) : [];
            editingRoutine = storedRoutines.find(routine => routine.id === routineId);

            loadEditRoutines(); // 수정 모드에 맞춰 UI를 다시 로드합니다.

            // 해당 routine-item의 .routine-edit-area를 찾아서 display 속성을 변경합니다.
            const routineItem = document.querySelector(`.routine-item[data-routine-id="${routineId}"]`);
            if (routineItem) {
                const editArea = routineItem.querySelector('.routine-edit-area');
                if (editArea) {
                    editArea.style.display = 'flex'; // 또는 'block' 등 적절한 값으로 변경
                }
            }
        }

        function saveEditedRoutine(routineId) {
            if (!editingRoutine) return;
            const editedNameInput = document.getElementById(`editName-${routineId}`);
            const editedExercises = [];
            const exerciseGroups = document.querySelectorAll(`.edit-exercise-group`);

            exerciseGroups.forEach(group => {
                const nameInput = group.querySelector('.edit-exercise-name');
                const weightInput = group.querySelector('.edit-exercise-weight');
                const repsInput = group.querySelector('.edit-exercise-reps');
                const useLbsCheckbox = group.querySelector('.edit-use-lbs');

                if (nameInput.value.trim()) {
                    let weight = parseFloat(weightInput.value) || '';
                    const unit = useLbsCheckbox.checked ? 'lbs' : 'kg';
                    editedExercises.push({
                        name: nameInput.value.trim(),
                        initialWeight: weight,
                        initialReps: repsInput.value || '',
                        unit: unit
                    });
                }
            });

            if (editedNameInput && editedExercises.length > 0) {
                const editedName = editedNameInput.value.trim();
                const existingRoutinesString = localStorage.getItem(ROUTINES_KEY);
                const existingRoutines = existingRoutinesString ? JSON.parse(existingRoutinesString) : [];

                const updatedRoutines = existingRoutines.map(routine => {
                    if (routine.id === routineId) {
                        return { ...routine, name: editedName, id: editedName.toLowerCase().replace(/ /g, '-'), exercises: editedExercises };
                    }
                    return routine;
                });

                localStorage.setItem(ROUTINES_KEY, JSON.stringify(updatedRoutines));
                currentlyEditingId = null;
                editingRoutine = null;
                loadRoutines();
            } else if(editedNameInput) {
                const editedName = editedNameInput.value.trim();
                const existingRoutinesString = localStorage.getItem(ROUTINES_KEY);
                const existingRoutines = existingRoutinesString ? JSON.parse(existingRoutinesString) : [];

                const updatedRoutines = existingRoutines.map(routine => {
                    if (routine.id === routineId) {
                        return { ...routine, name: editedName, id: editedName.toLowerCase().replace(/ /g, '-')};
                    }
                    return routine;
                });

                localStorage.setItem(ROUTINES_KEY, JSON.stringify(updatedRoutines));
                currentlyEditingId = null; 
                editingRoutine = null; 
                loadRoutines();
            }
        }

        function addExerciseInputForEdit(routineId) {
            const editExercisesContainer = document.querySelector(`.routine-item[data-routine-id="${routineId}"] .edit-exercises-container`);
            if (editExercisesContainer) {
                const newExerciseInput = document.createElement('div');
                newExerciseInput.classList.add('edit-exercise-group');
                newExerciseInput.innerHTML = `
                    <input type="text" class="edit-exercise-name" placeholder="운동 이름">
                    <div style="display: flex; align-items: center;">
                        <input type="number" class="edit-exercise-weight" placeholder="초기 무게">
                        <label style="margin-left: 10px;"><input type="checkbox" class="edit-use-lbs"> 파운드 (LBS)</label>
                    </div>
                    <input type="number" class="edit-exercise-reps" placeholder="기본 횟수">
                    <button type="button" class="remove-exercise-button" onclick="removeExerciseInput(this)">-</button>
                `;
                editExercisesContainer.appendChild(newExerciseInput);
            }
        }

        function deleteRoutine(routineId) {
            if (confirm('정말로 이 루틴을 삭제하시겠습니까?')) {
                const existingRoutinesString = localStorage.getItem(ROUTINES_KEY);
                const existingRoutines = existingRoutinesString ? JSON.parse(existingRoutinesString) : [];

                const updatedRoutines = existingRoutines.filter(routine => routine.id !== routineId);
                localStorage.setItem(ROUTINES_KEY, JSON.stringify(updatedRoutines));
                loadRoutines();
            }
        }

        function removeExerciseInput(button) {
            button.parentNode.remove();
        }

        /*****
         * 2025-04-30 유연한 편집기능 관련 추가 코드 
         */
         const todayWorkoutEditArea = document.getElementById('todayWorkoutEditArea');
        const todayExercisesContainer = document.getElementById('todayExercisesContainer');
        const TODAY_WORKOUT_KEY_PREFIX = 'today_workout_';
        let currentTodayWorkout = null; // 현재 편집 중인 오늘의 운동 데이터

        // 루틴 시작 버튼 클릭 시 호출
        function startRoutineForToday(routineId) {
            const storedRoutines = JSON.parse(localStorage.getItem(ROUTINES_KEY) || '[]');
            const selectedRoutine = storedRoutines.find(routine => routine.id === routineId);

            if (selectedRoutine) {
                // 오늘의 운동 임시 데이터 생성 (기존 루틴 복사)
                currentTodayWorkout = {
                    id: `${TODAY_WORKOUT_KEY_PREFIX}${routineId}_${new Date().toISOString().slice(0, 10)}`,
                    name: `오늘의 운동 (${selectedRoutine.name})`,
                    exercises: selectedRoutine.exercises.map(ex => ({ ...ex })) // 깊은 복사
                };
                localStorage.setItem(currentTodayWorkout.id, JSON.stringify(currentTodayWorkout));
                loadTodayWorkoutEditView();
            }
        }

        // 오늘의 운동 편집 화면 표시
        function loadTodayWorkoutEditView() {
            todayExercisesContainer.innerHTML = '';
            if (currentTodayWorkout && currentTodayWorkout.exercises) {
                currentTodayWorkout.exercises.forEach((exercise, index) => {
                    const exerciseDiv = document.createElement('div');
                    exerciseDiv.classList.add('today-exercise-group');
                    exerciseDiv.innerHTML = `
                        <span class="drag-handle"><i class="fas fa-arrows-alt-v"></i></span>
                        <div>
                            <label>운동 이름</label>
                            <input type="text" value="${exercise.name}" onchange="updateTodayExercise(${index}, 'name', this.value)">
                        </div>
                        <div>
                            <label>초기 무게</label>
                            <input type="number" value="${exercise.initialWeight}" onchange="updateTodayExercise(${index}, 'initialWeight', this.value)">
                        </div>
                        <div>
                            <label>기본 횟수</label>
                            <input type="number" value="${exercise.initialReps}" onchange="updateTodayExercise(${index}, 'initialReps', this.value)">
                        </div>
                        <div>
                            <label>단위</label>
                            <select onchange="updateTodayExercise(${index}, 'unit', this.value)">
                                <option value="kg" ${exercise.unit === 'kg' ? 'selected' : ''}>kg</option>
                                <option value="lbs" ${exercise.unit === 'lbs' ? 'selected' : ''}>lbs</option>
                            </select>
                        </div>
                        <div class="today-exercise-actions">
                            <button type="button" onclick="removeTodayExercise(${index})">- 삭제</button>
                        </div>
                    `;
                    todayExercisesContainer.appendChild(exerciseDiv);
                });

                // SortableJS 초기화
                Sortable.create(todayExercisesContainer, {
                    handle: '.drag-handle', // 드래그를 시작할 요소 지정 (여기서는 .drag-handle 클래스를 가진 span)
                    animation: 150, // 정렬 시 애니메이션 속도 (ms)
                    onEnd: function (evt) {
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;

                        // currentTodayWorkout.exercises 배열 순서 업데이트
                        const movedItem = currentTodayWorkout.exercises.splice(oldIndex, 1)[0];
                        currentTodayWorkout.exercises.splice(newIndex, 0, movedItem);

                        // localStorage에 업데이트된 오늘의 운동 정보 저장
                        localStorage.setItem(currentTodayWorkout.id, JSON.stringify(currentTodayWorkout));

                        // UI는 이미 드래그 앤 드롭으로 변경되었으므로 loadTodayWorkoutEditView()를 다시 호출할 필요는 없습니다.
                        // 필요하다면 추가적인 로직 (예: 순서 변경 알림)을 여기에 구현할 수 있습니다.
                    }
                });
            }
            todayWorkoutEditArea.style.display = 'block';
        }

        // 오늘의 운동에 새로운 운동 입력 필드 추가
        function addTodayExerciseInput() {
            if (currentTodayWorkout) {
                currentTodayWorkout.exercises.push({ name: '', initialWeight: '', initialReps: '', unit: 'kg' });
                localStorage.setItem(currentTodayWorkout.id, JSON.stringify(currentTodayWorkout));
                loadTodayWorkoutEditView();
            }
        }

        // 오늘의 운동 정보 업데이트
        function updateTodayExercise(index, property, value) {
            if (currentTodayWorkout && currentTodayWorkout.exercises[index]) {
                currentTodayWorkout.exercises[index][property] = value;
                localStorage.setItem(currentTodayWorkout.id, JSON.stringify(currentTodayWorkout));
            }
        }

        // 오늘의 운동에서 특정 운동 제거
        function removeTodayExercise(index) {
            if (currentTodayWorkout && currentTodayWorkout.exercises) {
                currentTodayWorkout.exercises.splice(index, 1);
                localStorage.setItem(currentTodayWorkout.id, JSON.stringify(currentTodayWorkout));
                loadTodayWorkoutEditView();
            }
        }

        // 오늘의 운동 편집 취소
        function cancelTodayWorkoutEdit() {
            todayWorkoutEditArea.style.display = 'none';
            currentTodayWorkout = null;
        }

        // 오늘의 운동 시작 (workout.html로 이동)
        function startTodayWorkout() {
            if (currentTodayWorkout) {
                window.location.href = `workout.html?todayWorkoutId=${currentTodayWorkout.id}`;
            } else {
                alert('편집할 오늘의 운동이 없습니다.');
            }
        }
        /********************************************
         * 끝
        */
        
        function loadEditRoutines() {
            routineListContainer.innerHTML = '';
            const storedRoutinesString = localStorage.getItem(ROUTINES_KEY);
            const storedRoutines = storedRoutinesString ? JSON.parse(storedRoutinesString) : [];

            storedRoutines.forEach(routine => {
                const routineItem = document.createElement('div');
                routineItem.classList.add('routine-item');
                routineItem.dataset.routineId = routine.id;

                if (currentlyEditingId === routine.id && editingRoutine) {
                    let editExercisesHTML = `<div class="edit-exercises-container">`;
                    editingRoutine.exercises.forEach((exercise, index) => {
                        editExercisesHTML += `
                            <div class="edit-exercise-group">
                                <label for="editExerciseName-${index}"><i class="fas fa-dumbbell"></i> 운동 이름</label>
                                <input type="text" class="edit-exercise-name" id="editExerciseName-${index}" value="${exercise.name}" placeholder="운동 이름">
                                <label for="editExerciseWeight-${index}">초기 무게</label>
                                <div style="display: flex; align-items: center;">
                                    <input type="number" class="edit-exercise-weight" id="editExerciseWeight-${index}" value="${exercise.initialWeight}" placeholder="초기 무게">
                                    <label style="margin-left: 10px;"><input type="checkbox" class="edit-use-lbs" ${exercise.unit === 'lbs' ? 'checked' : ''}> 파운드 (LBS)</label>
                                </div>
                                <label for="editExerciseReps-${index}"><i class="fas fa-sort-numeric-up"></i> 기본 횟수</label>
                                <input type="number" class="edit-exercise-reps" id="editExerciseReps-${index}" value="${exercise.initialReps}" placeholder="기본 횟수">
                                <button type="button" class="remove-exercise-button" onclick="removeExerciseInput(this)">-</button>
                            </div>
                        `;
                    });
                    editExercisesHTML += `</div><button type="button" id="addEditExerciseButton" onclick="addExerciseInputForEdit('${routine.id}')">운동 추가</button>`;

                    routineItem.innerHTML = `
                        <h2>루틴 편집</h2>
                        <input type="text" id="editName-${routine.id}" class="edit-input" value="${editingRoutine.name}" placeholder="루틴 이름">
                        <div class="routine-edit-area">
                            ${editExercisesHTML}
                            <div class="routine-edit-actions">
                                <button onclick="saveEditedRoutine('${routine.id}')">저장</button>
                                <button onclick="currentlyEditingId = null; editingRoutine = null; loadRoutines()">취소</button>
                            </div>
                        </div>
                    `;
                } else {
                    let exercisesText = routine.exercises.map(ex => ex.name + (ex.initialReps ? `(${ex.initialReps}회)` : '')).join(', ');
                    if (exercisesText.length > 30) {
                        exercisesText = exercisesText.substring(0, 30) + '...';
                    }

                    routineItem.innerHTML = `
                        <span class="routine-name">${routine.name} (${exercisesText})</span>
                        <div class="routine-actions">
                            <button onclick="editRoutine('${routine.id}')">수정</button>
                            <a href="workout.html?routineId=${routine.id}"><button>시작</button></a>
                            <div class="delete-button-container"></div>
                        </div>
                    `;

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = '삭제';
                    deleteButton.onclick = function() {
                        deleteRoutine(routine.id);
                    };

                    const deleteButtonContainer = routineItem.querySelector('.delete-button-container');
                    deleteButtonContainer.appendChild(deleteButton);
                }
                routineListContainer.appendChild(routineItem);
            });
        }
            
        // 기존 루틴 목록 렌더링 함수 수정
        function loadRoutines() {
            routineListContainer.innerHTML = '';
            const storedRoutines = JSON.parse(localStorage.getItem(ROUTINES_KEY) || '[]');

            storedRoutines.forEach(routine => {
                const routineItem = document.createElement('div');
                routineItem.classList.add('routine-item');
                routineItem.dataset.routineId = routine.id;

                let exercisesText = routine.exercises.map(ex => ex.name + (ex.initialReps ? `(${ex.initialReps}회)` : '')).join(', ');
                if (exercisesText.length > 30) {
                    exercisesText = exercisesText.substring(0, 30) + '...';
                }

                routineItem.innerHTML = `
                    <span class="routine-name">${routine.name} (${exercisesText})</span>
                    <div class="routine-actions">
                        <button onclick="editRoutine('${routine.id}')">수정</button>
                        <button onclick="startRoutineForToday('${routine.id}')">시작</button>
                        <div class="delete-button-container">
                            <button onclick="deleteRoutine('${routine.id}')">삭제</button>
                        </div>
                    </div>
                `;
                routineListContainer.appendChild(routineItem);
            });
        }   

        const todayWorkoutDetailsContainer = document.getElementById('todayWorkoutDetails');
        const WORKOUT_DATA_KEY_PREFIX = 'workout_data_';

        function loadTodayWorkoutLog() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const currentDate = `${year}-${month}-${day}`;
            //const workoutDataKey = `${WORKOUT_DATA_KEY_PREFIX}_${currentDate}`; 

            const keys = Object.keys(localStorage);
            const todayWorkoutLogs = [];

            keys.forEach(key => {
                if (key.includes(`_${currentDate}_fin`)) {
                    const logData = localStorage.getItem(key);
                    if (logData) {
                        todayWorkoutLogs.push(JSON.parse(logData));
                    }
                }
            });

            let logHTML = '';
            if (todayWorkoutLogs.length > 0) {
                const storedRoutinesString = localStorage.getItem(ROUTINES_KEY);
                const storedRoutines = storedRoutinesString ? JSON.parse(storedRoutinesString) : [];

                todayWorkoutLogs.forEach((workoutLog, index) => {
                    // 키 이름에서 routineId 추출
                    const parts = keys.find(key => localStorage.getItem(key) === JSON.stringify(workoutLog))?.split('_');
                    const routineIdFromKey = parts ? parts[4] : null; // workout_data_{routineId}_YYYY-MM-DD

                    const currentRoutine = storedRoutines.find(routine => routine.id === routineIdFromKey);
                    const routineName = currentRoutine ? currentRoutine.name : '알 수 없는 루틴';

                    logHTML += `<h3>${routineName} (${currentDate})</h3>`;
                    workoutLog.forEach((exercise, exerciseIndex) => {
                        logHTML += `<div style="border: 1px solid #ddd; padding: 5px; margin-top: 5px; border-radius: 5px;">
                            <p style="margin-top: 0; font-weight: bold; font-size: 0.9em;">${exercise.name}</p>`;

                        exercise.sets.forEach((set, setIndex) => {
                            logHTML += `<p style="margin-left: 15px; margin-bottom: 5px; font-size: 0.85em;">Set ${setIndex + 1} - 무게: ${set.weight || '-'}kg, 횟수: ${set.reps || '-'}회, 세트 수: ${set.setNum || '-'}</p>`;
                        });
                        logHTML += `</div>`; // 운동 항목 div 닫기
                    });

                    if (index < todayWorkoutLogs.length - 1) {
                        logHTML += '<hr>'; // 각 루틴 기록 사이에 구분선 추가
                    }
                });
            } else {
                logHTML = '<p>오늘 운동 기록이 없습니다.</p>';
            }
            todayWorkoutDetailsContainer.innerHTML = logHTML;
        }

        function shareWorkoutLog() {
            const shareableContent = document.getElementById('todayWorkoutDetails');
            if (shareableContent.innerHTML.trim() === '<p>오늘 운동 기록이 없습니다.</p>' || shareableContent.innerHTML.trim() === '') {
                alert('공유할 운동 기록이 없습니다.');
                return;
            }

            // 기존 스타일 백업
            const originalPadding = shareableContent.style.padding;

            // 캡처할 요소에 패딩 추가
            shareableContent.style.padding = '10px';

            // html2canvas 라이브러리를 사용하여 DOM 요소를 이미지로 캡처
            html2canvas(shareableContent).then(canvas => {
                const targetWidth = 900; // 원하는 너비
                const targetHeight = canvas.height * (targetWidth / canvas.width); // 비율 유지

                const resizedCanvas = document.createElement('canvas');
                resizedCanvas.width = targetWidth;
                resizedCanvas.height = targetHeight;
                const ctx = resizedCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, targetWidth, targetHeight);

                const dataURL = resizedCanvas.toDataURL('image/png');

                // 캡처 후 원래 패딩 복원
                shareableContent.style.padding = originalPadding;

                displayShareOptions(dataURL);
            });
        }

        function displayShareOptions(imageDataURL) {
            const shareableContent = document.getElementById('todayWorkoutDetails');
            let shareHTML = '';
            const workoutDetails = shareableContent.innerHTML;

            const regex = /<h3>(.*?)<\/h3>([\s\S]*?)<hr>/g;
            let match;

            while ((match = regex.exec(workoutDetails)) !== null) {
                const exerciseNameWithUnitMatch = match[1].match(/(.*?)\s*\((.*?)\)/);
                const exerciseName = exerciseNameWithUnitMatch ? exerciseNameWithUnitMatch[1] : match[1];
                const unit = exerciseNameWithUnitMatch ? exerciseNameWithUnitMatch[2] : 'kg';
                const setsInfo = match[2].replace(/<strong>(.*?)<\/strong>:\s*([\d.-]+)\s*kg/g, `<strong>$1</strong>: $2 ${unit}`);

                shareHTML += `<h3>${exerciseName} (${unit})</h3>${setsInfo}<hr>`;
            }

            // 간단한 이미지 미리보기 및 다운로드 링크 제공
            const previewWindow = window.open('', '_blank');
            previewWindow.document.write(`
                <html>
                <head>
                    <title>오늘의 운동 기록 공유</title>
                </head>
                <body>
                    <div class="share-container">
                        <h1>오늘의 운동 기록</h1>
                        <img src="${imageDataURL}" alt="오늘의 운동 기록">
                        <div class="workout-log-entry">${shareHTML}</div>
                        <a href="${imageDataURL}" download="오늘의_운동_기록.png">이미지 다운로드</a>
                    </div>
                </body>
                </html>
            `);
        }

        // 페이지 로드 시 오늘의 운동 기록을 불러옵니다.
        window.onload = function() {
            loadRoutines();
            loadTodayWorkoutLog(); // 오늘의 운동 기록 로드
        };

    </script>
</body>
</html>
