<!DOCTYPE html>
<html>
<head>
    <title>운동 기록</title>
    <link rel="stylesheet" href="style.css?v=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Nanum Gothic', sans-serif;
            margin: 20px;
        }
        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .exercise-record {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .exercise-header {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .set-input-group {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .set-input-group label {
            margin-right: 10px;
        }
        .set-input-group input[type="number"],
        .set-input-group input[type="text"] {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
            width: 80px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #workoutCompleteArea {
            margin-top: 20px;
            text-align: center;
        }
    </style>
    <script>
        const CURRENT_VERSION = '2.0'; // 현재 프로젝트 버전

        window.onload = function() {
            checkVersion();
        };

        function checkVersion() {
            const storedVersion = localStorage.getItem('app_version');
            if (storedVersion !== CURRENT_VERSION) {
                console.log('버전이 업데이트되었습니다. 강제 새로고침합니다.');
                localStorage.setItem('app_version', CURRENT_VERSION);
                window.location.reload(true); // 강제 새로고침
            }
        }
    </script>
</head>
<body>
    <h1 id="workoutRoutineName"></h1>
    <div id="workoutExercises">
        </div>
    <div id="workoutCompleteArea">
        <button onclick="finishWorkout()">운동 완료</button>
        <button onclick="goBackToIndex()">돌아가기</button>
    </div>

    <script>
        const workoutRoutineNameElement = document.getElementById('workoutRoutineName');
        const workoutExercisesContainer = document.getElementById('workoutExercises');
        const WORKOUT_DATA_KEY_PREFIX = 'workout_data_';
        const TODAY_WORKOUT_KEY_PREFIX = 'today_workout_';
        let todayWorkoutData = null;

        // 페이지 로드 시 실행
        window.onload = function() {
            loadTodayWorkout();
        };

        // 쿼리 파라미터에서 todayWorkoutId를 가져오는 함수
        function getQueryParam(name) {
            const urlSearchParams = new URLSearchParams(window.location.search);
            return urlSearchParams.get(name);
        }

        // localStorage에서 '오늘의 운동' 데이터 로드
        function loadTodayWorkout() {
            const todayWorkoutId = getQueryParam('todayWorkoutId');
            if (todayWorkoutId) {
                const storedWorkoutData = localStorage.getItem(todayWorkoutId);
                if (storedWorkoutData) {
                    todayWorkoutData = JSON.parse(storedWorkoutData);
                    displayWorkoutExercises();
                } else {
                    alert('오늘의 운동 데이터를 찾을 수 없습니다.');
                    window.location.href = 'index.html'; // 데이터 없으면 index.html로 리다이렉트
                }
            } else {
                alert('루틴 ID가 없습니다.');
                window.location.href = 'index.html'; // ID 없으면 index.html로 리다이렉트
            }
        }

        // 운동 기록 UI 표시
        function displayWorkoutExercises() {
            if (todayWorkoutData && todayWorkoutData.exercises) {
                workoutRoutineNameElement.textContent = todayWorkoutData.name;
                todayWorkoutData.exercises.forEach((exercise, exerciseIndex) => {
                    const exerciseDiv = document.createElement('div');
                    exerciseDiv.classList.add('exercise-record');
                    exerciseDiv.innerHTML = `
                        <div class="exercise-header">${exercise.name} (${exercise.initialWeight}${exercise.unit || 'kg'} x ${exercise.initialReps}회)</div>
                        <div id="exercise-${exerciseIndex}-sets">
                            </div>
                        <button onclick="addSetInput(${exerciseIndex})">세트 추가</button>
                    `;
                    workoutExercisesContainer.appendChild(exerciseDiv);
                    addSetInput(exerciseIndex); // 초기 세트 입력 필드 하나 추가
                });
            }
        }

        // 세트 입력 필드 추가
        function addSetInput(exerciseIndex) {
            const setsContainer = document.getElementById(`exercise-${exerciseIndex}-sets`);
            const setNumber = setsContainer.children.length + 1;
            const setInputGroup = document.createElement('div');
            setInputGroup.classList.add('set-input-group');
            setInputGroup.innerHTML = `
                <label>세트 ${setNumber}</label>
                <label for="weight-${exerciseIndex}-${setNumber}">무게 (${todayWorkoutData.exercises[exerciseIndex].unit || 'kg'})</label>
                <input type="number" id="weight-${exerciseIndex}-${setNumber}">
                <label for="reps-${exerciseIndex}-${setNumber}">횟수</label>
                <input type="number" id="reps-${exerciseIndex}-${setNumber}">
                <label for="setNum-${exerciseIndex}-${setNumber}">세트 수</label>
                <div>
                    <button type="button" onclick="incrementSet('setNum-${exerciseIndex}-${setNumber}')">+</button>                    
                    <input type="number" id="setNum-${exerciseIndex}-${setNumber}" value="${setNumber}">
                    <button type="button" onclick="decrementSet('setNum-${exerciseIndex}-${setNumber}')">-</button>
                </div>
            `;
            setsContainer.appendChild(setInputGroup);
        }

        function incrementSet(inputElementId) {
            const inputElement = document.getElementById(inputElementId);
            if (inputElement) {
                inputElement.value = parseInt(inputElement.value || 0) + 1;
            }
        }

        function decrementSet(inputElementId) {
            const inputElement = document.getElementById(inputElementId);
            if (inputElement && parseInt(inputElement.value || 0) > 1) {
                inputElement.value = parseInt(inputElement.value) - 1;
            }
        }

        // 운동 기록 저장 (임시 - 실제로는 localStorage 등에 저장해야 함)
        function saveWorkoutLog() {
            const workoutLog = [];
            todayWorkoutData.exercises.forEach((exercise, exerciseIndex) => {
                const exerciseSets = [];
                const setsContainer = document.getElementById(`exercise-${exerciseIndex}-sets`);
                for (let i = 0; i < setsContainer.children.length; i++) {
                    const setInputGroup = setsContainer.children[i];
                    const weightInput = setInputGroup.querySelector(`#weight-${exerciseIndex}-${i + 1}`);
                    const repsInput = setInputGroup.querySelector(`#reps-${exerciseIndex}-${i + 1}`);
                    const setNumInput = setInputGroup.querySelector(`#setNum-${exerciseIndex}-${i + 1}`);
                    exerciseSets.push({
                        weight: weightInput ? parseFloat(weightInput.value) : '',
                        reps: repsInput ? parseInt(repsInput.value) : '',
                        setNum: setNumInput ? parseInt(setNumInput.value) : ''
                    });
                }
                workoutLog.push({
                    name: exercise.name,
                    sets: exerciseSets
                });
            });

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const currentDate = `${year}-${month}-${day}`;
            const workoutDataKey = `${WORKOUT_DATA_KEY_PREFIX}${todayWorkoutData.id}_fin`;
            localStorage.setItem(workoutDataKey, JSON.stringify(workoutLog));
            alert('운동 기록이 저장되었습니다.');
        }

        // 운동 완료
        function finishWorkout() {
            saveWorkoutLog();
            alert('오늘의 운동을 완료했습니다!');
            window.location.href = 'index.html';
        }

        // index.html로 돌아가기
        function goBackToIndex() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
